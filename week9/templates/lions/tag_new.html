{% extends 'lions/base.html' %}

{% block content %}
<h2>태그 추가</h2>

<div class="card" style="max-width:400px;">
    <form method="post">
        {% csrf_token %}
        <div class="form-group">
            <label for="name">태그명</label>
            <input type="text" id="name" name="name" placeholder="예: 우수상, 개근상" required>
        </div>
        <div style="display:flex; gap:8px; margin-top:8px;">
            <button type="submit" class="btn btn-primary">추가</button>
            <a href="{% url 'tag_list' %}" class="btn">취소</a>
        </div>
    </form>
</div>
{% endblock %}
