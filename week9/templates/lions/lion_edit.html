{% extends 'lions/base.html' %}

{% block content %}
<h2>아기사자 수정</h2>

<div class="card" style="max-width:480px;">
    <form method="post">
        {% csrf_token %}
        <div class="form-group">
            <label for="name">이름</label>
            <input type="text" id="name" name="name" value="{{ lion.name }}" required>
        </div>
        <div class="form-group">
            <label for="track">트랙</label>
            <select id="track" name="track" required>
                {% for value, label in track_choices %}
                <option value="{{ value }}" {% if lion.track == value %}selected{% endif %}>{{ label }}</option>
                {% endfor %}
            </select>
        </div>
        <div style="display:flex; gap:8px; margin-top:8px;">
            <button type="submit" class="btn btn-primary">저장</button>
            <a href="{% url 'lion_detail' lion.pk %}" class="btn">취소</a>
        </div>
    </form>
</div>
{% endblock %}
