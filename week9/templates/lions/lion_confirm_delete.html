{% extends 'lions/base.html' %}

{% block content %}
<h2>아기사자 삭제</h2>

<div class="card" style="max-width:480px;">
    <p style="margin-bottom:16px;">
        <strong>{{ lion.name }}</strong> ({{ lion.track }}) 을(를) 정말 삭제하시겠습니까?<br>
        <span style="color:#ef4444; font-size:13px;">
            ⚠️ CASCADE 삭제: 연결된 Task {{ lion.tasks.count }}개와 프로필도 함께 삭제됩니다.
        </span>
    </p>
    <form method="post" style="display:flex; gap:8px;">
        {% csrf_token %}
        <button type="submit" class="btn btn-danger">삭제 확인</button>
        <a href="{% url 'lion_detail' lion.pk %}" class="btn">취소</a>
    </form>
</div>
{% endblock %}
